# Publishes the package to npm, as @graphnous/theme: the
# compiled components, their types, and theme.css for Tailwind CSS
# (npm run build, scripts/package.mjs).
#
# Runs when a version tag is pushed, such as v0.2.0, which must be the
# version in package.json; or by hand, for the version in package.json.

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Writes an .npmrc that publishes to npm with NODE_AUTH_TOKEN
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the tag is the package's version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not package.json's version, ${version}"
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # The repository the package's page on npm links to
          REPOSITORY: ${{ github.repository }}

      - name: Publish
        run: npm publish ./dist
        env:
          # An npm token that can publish to the @graphnous organization
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
